{% extends "base.html" %}

{% block title %}Settings - ACI Migrator{% endblock %}
{% block page_title %}Settings{% endblock %}

{% block content %}
<div class="max-w-3xl">
    <div class="bg-white rounded-2xl shadow-lg p-8 border border-gray-100">
        <h1 class="text-2xl font-bold text-gray-900 mb-2">UI Mode</h1>
        <p class="text-sm text-gray-600 mb-6">
            Choose between the classic workflow (Analyze + Visualize) and the new data-centric layout.
        </p>

        <form method="post" action="{{ url_for('set_ui_mode') }}" class="space-y-4">
            <label class="flex items-start gap-3 p-4 border border-gray-200 rounded-xl cursor-pointer hover:border-primary-400">
                <input type="radio" name="ui_mode" value="classic" {% if ui_mode == 'classic' %}checked{% endif %} class="mt-1">
                <div>
                    <div class="font-semibold text-gray-900">Classic</div>
                    <div class="text-sm text-gray-600">Keep Analyze and Visualize as separate pages.</div>
                </div>
            </label>

            <label class="flex items-start gap-3 p-4 border border-gray-200 rounded-xl cursor-pointer hover:border-primary-400">
                <input type="radio" name="ui_mode" value="data" {% if ui_mode == 'data' %}checked{% endif %} class="mt-1">
                <div>
                    <div class="font-semibold text-gray-900">Data-Centric</div>
                    <div class="text-sm text-gray-600">Single Data Explorer hub with deduped, data-first views.</div>
                </div>
            </label>

            <div class="pt-2">
                <button type="submit" class="inline-flex items-center px-4 py-2 rounded-lg bg-primary-600 text-white text-sm font-semibold hover:bg-primary-700 transition-colors">
                    Save Preference
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
